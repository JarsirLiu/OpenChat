name: openchat-middleware

services:
  postgres:
    image: postgres:15-alpine
    container_name: openchat-middleware-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openchat}
      - POSTGRES_USER=${POSTGRES_USER:-openchat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openchat123456}
    volumes:
      - ./data-middleware/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchat} -d ${POSTGRES_DB:-openchat}"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: openchat-middleware-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${OPENCHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${OPENCHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ./data-middleware/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: openchat-middleware-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - OPENCHAT_S3_ACCESS_KEY_ID=${OPENCHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - OPENCHAT_S3_SECRET_ACCESS_KEY=${OPENCHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - OPENCHAT_S3_BUCKET=${OPENCHAT_S3_BUCKET:-openchat-media}
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    volumes:
      - ./scripts:/scripts:ro
    restart: "no"
