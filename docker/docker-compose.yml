name: openchat

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  acme-init:
    image: neilpang/acme.sh:latest
    container_name: openchat-acme-init
    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - ./scripts:/scripts:ro
      - ${OPENCHAT_SSL_DIR:-./nginx/ssl}:/acme-certs
      - ./nginx/acme:/var/www/acme
      - acme_data:/acme-data
    entrypoint: ["/bin/sh", "/scripts/acme-init.sh"]
    depends_on:
      nginx:
        condition: service_healthy
    logging: *default-logging
    restart: "no"

  acme-renew:
    image: neilpang/acme.sh:latest
    container_name: openchat-acme-renew
    env_file:
      - .env.example
      - path: .env
        required: false
    volumes:
      - ./scripts:/scripts:ro
      - ${OPENCHAT_SSL_DIR:-./nginx/ssl}:/acme-certs
      - ./nginx/acme:/var/www/acme
      - acme_data:/acme-data
    entrypoint: ["/bin/sh", "/scripts/acme-renew.sh"]
    depends_on:
      nginx:
        condition: service_healthy
      acme-init:
        condition: service_completed_successfully
    logging: *default-logging
    restart: unless-stopped

  app:
    image: ${OPENCHAT_APP_IMAGE:-openchat-app:latest}
    container_name: openchat-app
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - OPENCHAT_SERVER_ADDR=0.0.0.0:8787
      - OPENCHAT_CATALOG_PATH=/app/config/model-catalog.json
      - OPENCHAT_DATABASE_URL=${OPENCHAT_DATABASE_URL:-postgresql://openchat:openchat123456@postgres:5432/openchat}
      - OPENCHAT_PROVIDER_SECRET_KEY=${OPENCHAT_PROVIDER_SECRET_KEY:-openchat-prod-provider-secret}
      - OPENCHAT_MEDIA_STORAGE_BACKEND=${OPENCHAT_MEDIA_STORAGE_BACKEND:-s3}
      - OPENCHAT_S3_ENDPOINT=${OPENCHAT_S3_ENDPOINT:-http://minio:9000}
      - OPENCHAT_S3_REGION=${OPENCHAT_S3_REGION:-us-east-1}
      - OPENCHAT_S3_BUCKET=${OPENCHAT_S3_BUCKET:-openchat-media}
      - OPENCHAT_S3_ACCESS_KEY_ID=${OPENCHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - OPENCHAT_S3_SECRET_ACCESS_KEY=${OPENCHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - OPENCHAT_S3_PUBLIC_BASE_URL=${OPENCHAT_S3_PUBLIC_BASE_URL:-http://localhost/openchat-media}
      - OPENCHAT_S3_FORCE_PATH_STYLE=${OPENCHAT_S3_FORCE_PATH_STYLE:-true}
      - RUST_LOG=${RUST_LOG:-openchat_server=info,openchat_core=info,tower_http=info}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped

  nginx:
    image: ${OPENCHAT_NGINX_IMAGE:-openchat-nginx:latest}
    container_name: openchat-nginx
    env_file:
      - .env.example
      - path: .env
        required: false
    environment:
      - OPENCHAT_SERVER_NAME=${OPENCHAT_SERVER_NAME:-_}
      - OPENCHAT_APP_UPSTREAM=${OPENCHAT_APP_UPSTREAM:-app:8787}
      - OPENCHAT_MINIO_UPSTREAM=${OPENCHAT_MINIO_UPSTREAM:-minio:9000}
      - OPENCHAT_CLIENT_MAX_BODY_SIZE=${OPENCHAT_CLIENT_MAX_BODY_SIZE:-120m}
      - SSL_CERT_NAME=${SSL_CERT_NAME:-localhost}
      - NGINX_CERT_RELOAD_INTERVAL_SECONDS=${NGINX_CERT_RELOAD_INTERVAL_SECONDS:-21600}
      - NGINX_CERT_RELOAD_CHECK_SECONDS=${NGINX_CERT_RELOAD_CHECK_SECONDS:-30}
      - NGINX_CERT_RELOAD_FLAG_FILE=${NGINX_CERT_RELOAD_FLAG_FILE:-/etc/nginx/ssl/.reload-nginx}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-k", "-fsS", "https://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ${OPENCHAT_SSL_DIR:-./nginx/ssl}:/etc/nginx/ssl
      - ./nginx/acme:/var/www/acme
    logging: *default-logging
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: openchat-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-openchat}
      - POSTGRES_USER=${POSTGRES_USER:-openchat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openchat123456}
    volumes:
      - ${OPENCHAT_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openchat} -d ${POSTGRES_DB:-openchat}"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: openchat-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${OPENCHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${OPENCHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - ${OPENCHAT_DATA_DIR:-./data}/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: openchat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - OPENCHAT_S3_ACCESS_KEY_ID=${OPENCHAT_S3_ACCESS_KEY_ID:-minioadmin}
      - OPENCHAT_S3_SECRET_ACCESS_KEY=${OPENCHAT_S3_SECRET_ACCESS_KEY:-minioadmin}
      - OPENCHAT_S3_BUCKET=${OPENCHAT_S3_BUCKET:-openchat-media}
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    volumes:
      - ./scripts:/scripts:ro
    logging: *default-logging
    restart: "no"

networks:
  default:
    name: openchat

volumes:
  acme_data:
