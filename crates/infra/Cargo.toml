[package]
name = "openchat-infra"
version.workspace = true
edition.workspace = true

[lib]
name = "openchat_infra"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
argon2 = "0.5"
async-trait = "0.1"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres"] }
tokio.workspace = true
