[package]
name = "openchat-api"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
async-trait = "0.1"
axum = { version = "0.7", features = ["macros", "multipart"] }
axum-extra = { version = "0.9", features = ["cookie"] }
async-stream = "0.3"
base64 = "0.22"
dotenvy = "0.15"
futures-util = "0.3"
openchat-account-core = { path = "../../crates/account-core" }
openchat-catalog-core = { path = "../../crates/catalog-core" }
openchat-core = { path = "../../crates/openchat-core" }
openchat-infra = { path = "../../crates/infra" }
openchat-security-core = { path = "../../crates/security-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
time = "0.3"
lopdf = "0.34"
quick-xml = "0.36"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
